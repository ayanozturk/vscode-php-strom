name: Security fuzz smoke

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  indexer-fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
          cache: true
      - name: Fuzz production parser and index paths
        run: go test ./indexer -run='^$' -fuzz='^FuzzParseSourceProductionPaths$' -fuzztime=20s
